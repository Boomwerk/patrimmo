services:

  postgres:
    image: postgres:16-alpine
    container_name: immo_postgres
    environment:
      POSTGRES_DB: patrimmodb
      POSTGRES_USER: DevBoomwerkBDD
      POSTGRES_PASSWORD: stlN2@E9PABS5eizrPxW
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: immo_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit
    container_name: immo_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"   

volumes:
  postgres_data: